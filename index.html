<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>Vågen</title>
<meta name="description" content="Personal calorie, weight and training log.">
<meta name="theme-color" content="#1C5A61">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="Vågen">
<meta name="apple-mobile-web-app-status-bar-style" content="default">
<link rel="manifest" href="manifest.webmanifest">
<link rel="icon" href="icons/icon-192.png" type="image/png">
<link rel="apple-touch-icon" href="icons/apple-touch-icon.png">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Barlow+Condensed:wght@500;600;700&family=Barlow:wght@400;500;600&display=swap">
<style>
:root { padding-top: env(safe-area-inset-top, 0px); padding-bottom: env(safe-area-inset-bottom, 0px); }
html { -webkit-text-size-adjust: 100%; }
body { margin: 0; }
[hidden] { display: none !important; }
img { max-width: 100%; }
/* Layout: one-column phone log, fixed bottom nav, bottom sheet for logging. Numbers read like a kitchen-scale display. */
:root {
  --bg: #F2F4F3;
  --surface: #FFFFFF;
  --ink: #15201E;
  --muted: #5B6966;
  --line: #D8DEDC;
  --soft: #E4ECEA;
  --accent: #1C5A61;
  --accent-ink: #FFFFFF;
  --protein: #9C6210;
  --warn: #A9590A;
  --scrim: rgba(10, 20, 18, 0.45);
  --f-display: "Barlow Condensed", "Arial Narrow", "Roboto Condensed", sans-serif;
  --f-body: "Barlow", system-ui, -apple-system, "Segoe UI", sans-serif;
  --r: 10px;
}
@media (prefers-color-scheme: dark) {
  :root:not([data-theme="light"]) {
    --bg: #0F1514; --surface: #172020; --ink: #E6EDEB; --muted: #93A29F; --line: #283432;
    --soft: #1F2B29; --accent: #63B4B4; --accent-ink: #0B1413; --protein: #E2A852; --warn: #E59B4F;
    --scrim: rgba(0, 0, 0, 0.6); color-scheme: dark;
  }
}
:root[data-theme="dark"] {
  --bg: #0F1514; --surface: #172020; --ink: #E6EDEB; --muted: #93A29F; --line: #283432;
  --soft: #1F2B29; --accent: #63B4B4; --accent-ink: #0B1413; --protein: #E2A852; --warn: #E59B4F;
  --scrim: rgba(0, 0, 0, 0.6); color-scheme: dark;
}
* { box-sizing: border-box; }
body {
  background: var(--bg); color: var(--ink); font-family: var(--f-body); font-size: 16px; line-height: 1.45;
  padding-left: max(16px, env(safe-area-inset-left, 0px)); padding-right: max(16px, env(safe-area-inset-right, 0px));
  -webkit-tap-highlight-color: transparent;
}
body.lock { overflow: hidden; }
button, input, select { font: inherit; color: inherit; }
button { cursor: pointer; }
:focus-visible { outline: 2px solid var(--accent); outline-offset: 2px; }
.num { font-family: var(--f-display); font-variant-numeric: tabular-nums; letter-spacing: 0.01em; }
.muted { color: var(--muted); }
.app { max-width: 560px; margin: 0 auto; padding-block: 12px 160px; display: flex; flex-direction: column; gap: 20px; }

/* top */
.top { display: flex; align-items: center; justify-content: space-between; gap: 8px; }
.brand { font-family: var(--f-display); font-weight: 700; font-size: 22px; letter-spacing: 0.02em; }
.datenav { display: flex; align-items: center; gap: 4px; }
.datenav .lbl { min-width: 104px; text-align: center; font-weight: 600; }
.iconbtn { width: 40px; height: 40px; border-radius: 50%; border: 1px solid var(--line); background: var(--surface); display: grid; place-items: center; }
.iconbtn svg { width: 18px; height: 18px; }
.linkbtn { background: none; border: none; color: var(--accent); font-weight: 600; padding: 6px 4px; }

/* summary */
.summary { background: var(--surface); border: 1px solid var(--line); border-radius: 14px; padding: 18px; display: flex; flex-direction: column; gap: 14px; }
.big { display: flex; align-items: baseline; gap: 10px; flex-wrap: wrap; }
.big .n { font-family: var(--f-display); font-weight: 700; font-size: 64px; line-height: 0.9; font-variant-numeric: tabular-nums; }
.big .u { font-family: var(--f-display); font-size: 20px; font-weight: 600; text-transform: uppercase; letter-spacing: 0.06em; color: var(--muted); }
.big.over .n { color: var(--warn); }
.bar { height: 10px; background: var(--soft); border-radius: 6px; overflow: hidden; }
.bar > i { display: block; height: 100%; background: var(--accent); border-radius: 6px; transition: width .3s ease; }
.bar.p > i { background: var(--protein); }
.bar.over > i { background: var(--warn); }
.meta { display: flex; justify-content: space-between; gap: 12px; font-size: 14px; color: var(--muted); flex-wrap: wrap; }
.meta b { color: var(--ink); font-weight: 600; font-variant-numeric: tabular-nums; }
.nudge { font-size: 14px; background: var(--soft); border-radius: 8px; padding: 10px 12px; display: flex; justify-content: space-between; align-items: center; gap: 10px; }

/* weight */
.weight { background: var(--surface); border: 1px solid var(--line); border-radius: 14px; padding: 16px 18px; display: flex; flex-direction: column; gap: 12px; }
.weight .row1 { display: flex; align-items: center; justify-content: space-between; gap: 12px; flex-wrap: wrap; }
.h3 { font-family: var(--f-display); font-weight: 600; font-size: 15px; text-transform: uppercase; letter-spacing: 0.08em; color: var(--muted); margin: 0; }
.wform { display: flex; gap: 8px; align-items: center; }
.wform input { width: 92px; }
.trend { display: flex; gap: 16px; flex-wrap: wrap; font-size: 14px; color: var(--muted); }
.trend b { font-family: var(--f-display); font-size: 22px; font-weight: 600; color: var(--ink); font-variant-numeric: tabular-nums; }
.spark { width: 100%; height: 76px; display: block; }

/* meals */
.meal { display: flex; flex-direction: column; }
.mealhead { display: flex; align-items: center; justify-content: space-between; padding: 6px 0; border-bottom: 2px solid var(--ink); }
.mealhead h2 { margin: 0; font-family: var(--f-display); font-weight: 700; font-size: 20px; letter-spacing: 0.02em; }
.mealhead .k { font-family: var(--f-display); font-size: 18px; font-weight: 600; font-variant-numeric: tabular-nums; margin-left: 8px; color: var(--muted); }
.addsm { border: 1px solid var(--line); background: var(--surface); border-radius: 999px; padding: 4px 12px; font-weight: 600; font-size: 14px; color: var(--accent); }
.entry { display: flex; align-items: center; gap: 12px; padding: 10px 0; border-bottom: 1px solid var(--line); background: none; border-left: none; border-right: none; border-top: none; width: 100%; text-align: left; }
.entry .nm { flex: 1; min-width: 0; }
.entry .nm div:first-child { overflow-wrap: anywhere; }
.entry .d { font-size: 13px; color: var(--muted); }
.entry .kc { text-align: right; font-family: var(--f-display); font-size: 18px; font-weight: 600; font-variant-numeric: tabular-nums; white-space: nowrap; }
.entry .kc small { display: block; font-family: var(--f-body); font-size: 12px; font-weight: 500; color: var(--protein); }
.tag { display: inline-block; font-size: 11px; font-weight: 600; letter-spacing: .04em; text-transform: uppercase; padding: 1px 6px; border-radius: 4px; background: var(--soft); color: var(--muted); margin-left: 6px; vertical-align: 1px; }
.empty { padding: 12px 0; color: var(--muted); font-size: 14px; border-bottom: 1px solid var(--line); }
.copybtn { margin: 10px 0; width: 100%; text-align: left; border: 1px dashed var(--line); background: transparent; border-radius: var(--r); padding: 10px 12px; color: var(--accent); font-weight: 600; font-size: 14px; }
.partial { display: flex; gap: 10px; align-items: flex-start; font-size: 14px; color: var(--muted); }
.partial input { width: 20px; height: 20px; margin-top: 1px; accent-color: var(--accent); }

/* forms */
input[type="text"], input[type="number"], select {
  background: var(--surface); border: 1px solid var(--line); border-radius: 8px; padding: 10px 12px; min-height: 44px; width: 100%;
}
input:focus { border-color: var(--accent); }
label.f { display: flex; flex-direction: column; gap: 6px; font-size: 14px; font-weight: 500; }
label.f span.hint { font-weight: 400; color: var(--muted); font-size: 13px; }
.grid2 { display: grid; grid-template-columns: 1fr 1fr; gap: 12px; }
.btn { border: none; border-radius: 10px; padding: 12px 18px; min-height: 46px; font-weight: 600; background: var(--accent); color: var(--accent-ink); }
.btn.ghost { background: transparent; color: var(--accent); border: 1px solid var(--line); }
.btn.danger { background: transparent; color: var(--warn); border: 1px solid var(--line); }
.btn.full { width: 100%; }
.btnrow { display: flex; gap: 10px; flex-wrap: wrap; }
.btnrow .btn { flex: 1; }
.chips { display: flex; gap: 8px; flex-wrap: wrap; }
.chip { border: 1px solid var(--line); background: var(--surface); border-radius: 999px; padding: 6px 14px; font-weight: 600; font-size: 14px; min-height: 36px; }
.chip[aria-pressed="true"] { background: var(--accent); color: var(--accent-ink); border-color: var(--accent); }

/* pages */
.page { display: flex; flex-direction: column; gap: 16px; }
.page h1 { font-family: var(--f-display); font-size: 30px; font-weight: 700; margin: 0; letter-spacing: 0.01em; }
.page p { margin: 0; max-width: 62ch; }
.list { display: flex; flex-direction: column; }
.panel { background: var(--surface); border: 1px solid var(--line); border-radius: 14px; padding: 16px; display: flex; flex-direction: column; gap: 14px; }

/* nav */
.nav { position: fixed; left: 0; right: 0; bottom: 0; z-index: 20; background: var(--surface); border-top: 1px solid var(--line);
  padding-bottom: env(safe-area-inset-bottom, 0px); padding-left: max(8px, env(safe-area-inset-left, 0px)); padding-right: max(8px, env(safe-area-inset-right, 0px)); }
.nav .in { max-width: 560px; margin: 0 auto; display: grid; grid-template-columns: repeat(4, 1fr); }
.nav button { background: none; border: none; padding: 8px 4px 10px; display: flex; flex-direction: column; align-items: center; gap: 2px; font-size: 12px; font-weight: 600; color: var(--muted); }
.nav button svg { width: 22px; height: 22px; }
.nav button[aria-current="page"] { color: var(--accent); }
.fab { position: fixed; z-index: 21; right: calc(16px + env(safe-area-inset-right, 0px)); bottom: calc(76px + env(safe-area-inset-bottom, 0px));
  border: none; border-radius: 999px; background: var(--accent); color: var(--accent-ink); font-weight: 700; padding: 14px 22px; box-shadow: 0 6px 18px rgba(0,0,0,.18); display: flex; align-items: center; gap: 8px; }
.fab svg { width: 18px; height: 18px; }

/* sheet */
#sheetWrap { position: fixed; inset: 0; z-index: 40; }
.scrim { position: absolute; inset: 0; background: var(--scrim); }
.sheet { position: absolute; left: 0; right: 0; bottom: 0; max-height: 92%; background: var(--bg); border-radius: 18px 18px 0 0; display: flex; flex-direction: column;
  padding-bottom: env(safe-area-inset-bottom, 0px); animation: up .22s ease; }
@keyframes up { from { transform: translateY(24px); opacity: .6; } to { transform: none; opacity: 1; } }
@media (prefers-reduced-motion: reduce) { .sheet { animation: none; } .bar > i { transition: none; } }
.sheet .in { max-width: 560px; width: 100%; margin: 0 auto; overflow-y: auto; padding-block: 12px 20px;
  padding-left: max(16px, env(safe-area-inset-left, 0px)); padding-right: max(16px, env(safe-area-inset-right, 0px)); display: flex; flex-direction: column; gap: 14px; }
.shead { display: flex; align-items: center; justify-content: space-between; gap: 10px; }
.shead h2 { margin: 0; font-family: var(--f-display); font-size: 24px; font-weight: 700; }
.tabs { display: grid; grid-template-columns: repeat(3, 1fr); background: var(--soft); border-radius: 10px; padding: 3px; }
.tabs button { border: none; background: transparent; border-radius: 8px; padding: 8px; font-weight: 600; font-size: 14px; color: var(--muted); }
.tabs button[aria-selected="true"] { background: var(--surface); color: var(--ink); box-shadow: 0 1px 2px rgba(0,0,0,.08); }
.res { display: flex; align-items: center; gap: 10px; border-bottom: 1px solid var(--line); }
.res .pick { flex: 1; min-width: 0; text-align: left; background: none; border: none; padding: 10px 0; }
.res .pick div:first-child { font-weight: 500; overflow-wrap: anywhere; }
.res .pick div:last-child { font-size: 13px; color: var(--muted); }
.res .again { flex: none; border: 1px solid var(--line); background: var(--surface); color: var(--accent); border-radius: 999px; font-weight: 700; font-size: 13px; padding: 6px 10px; white-space: nowrap; }
.sec { font-family: var(--f-display); font-weight: 600; font-size: 14px; text-transform: uppercase; letter-spacing: 0.08em; color: var(--muted); margin-top: 6px; }
.addedbar { display: flex; justify-content: space-between; align-items: center; gap: 10px; background: var(--soft); border-radius: 10px; padding: 8px 12px; font-size: 14px; }
.amtbig { display: flex; align-items: flex-end; gap: 12px; }
.amtbig input { font-family: var(--f-display); font-size: 34px; font-weight: 600; width: 140px; min-height: 58px; font-variant-numeric: tabular-nums; }
.result { display: flex; gap: 22px; align-items: baseline; flex-wrap: wrap; }
.result .v { font-family: var(--f-display); font-size: 40px; font-weight: 700; font-variant-numeric: tabular-nums; line-height: 1; }
.result .l { font-size: 13px; color: var(--muted); }
.result .pv { color: var(--protein); }
.label100 { border: 2px solid var(--ink); border-radius: 6px; padding: 8px 12px; font-size: 14px; display: grid; grid-template-columns: 1fr auto; gap: 2px 16px; }
.label100 .t { grid-column: 1 / -1; font-weight: 700; border-bottom: 1px solid var(--ink); padding-bottom: 4px; margin-bottom: 2px; }
.label100 span:nth-child(odd):not(.t) { font-variant-numeric: tabular-nums; }
.note { font-size: 13px; color: var(--muted); }
.toggle { display: flex; gap: 10px; align-items: flex-start; font-size: 14px; }
.toggle input { width: 20px; height: 20px; accent-color: var(--accent); margin-top: 1px; flex: none; }
.ing { display: flex; align-items: center; gap: 10px; padding: 8px 0; border-bottom: 1px solid var(--line); }
.ing .nm { flex: 1; min-width: 0; overflow-wrap: anywhere; }
.ing .x { border: none; background: none; color: var(--muted); font-size: 20px; width: 36px; height: 36px; }
.totals { display: grid; grid-template-columns: repeat(2, 1fr); gap: 8px 16px; font-size: 14px; }
.totals b { font-family: var(--f-display); font-size: 22px; font-weight: 600; display: block; font-variant-numeric: tabular-nums; }

/* training */
.tt { font-family: var(--f-display); font-weight: 700; font-size: 26px; line-height: 1.1; }
.tmin { font-family: var(--f-display); font-weight: 600; font-size: 18px; color: var(--muted); margin-left: 6px; font-variant-numeric: tabular-nums; }
ul.plan { margin: 6px 0 0; padding: 0; list-style: none; display: flex; flex-direction: column; }
ul.plan li { padding: 5px 0; border-bottom: 1px dotted var(--line); font-variant-numeric: tabular-nums; }
ul.plan li:last-child { border-bottom: none; }
.wk { display: grid; grid-template-columns: 1fr 1fr; gap: 14px; }
.wk .meta { font-size: 13px; margin-bottom: 6px; }
@media (max-width: 420px) { .wk { grid-template-columns: 1fr; } }
.ok { color: var(--accent); font-weight: 700; }
.target { font-family: var(--f-display); font-weight: 600; font-size: 22px; line-height: 1.2; display: flex; flex-direction: column; gap: 4px; font-variant-numeric: tabular-nums;
  border-left: 3px solid var(--accent); padding: 2px 0 2px 12px; }
ul.plan.notes li { color: var(--muted); font-size: 14px; }
li.exl { display: flex; justify-content: space-between; align-items: baseline; gap: 12px; }
li.exl > span:first-child { min-width: 0; overflow-wrap: anywhere; }
.kg { font-family: var(--f-display); font-weight: 600; font-size: 19px; text-align: right; white-space: nowrap; font-variant-numeric: tabular-nums; }
.kg small { display: block; font-family: var(--f-body); font-size: 12px; font-weight: 500; color: var(--muted); }
.linkrow { background: none; border: none; text-align: left; padding: 0; cursor: pointer; }
.gridauto { display: grid; grid-template-columns: repeat(auto-fill, minmax(8.5rem, 1fr)); gap: 12px; }
.exlog { display: grid; grid-template-columns: 1fr auto; gap: 8px 12px; align-items: center; padding: 10px 0; border-bottom: 1px solid var(--line); }
.exlog > div:first-child { min-width: 0; overflow-wrap: anywhere; }
.exlog .toggle { grid-column: 1 / -1; }
.exin { display: flex; align-items: center; gap: 6px; }
.exin input { width: 88px; text-align: right; }
.otherf { display: flex; flex-direction: column; gap: 12px; padding: 12px; border: 1px dashed var(--line); border-radius: var(--r); }
fieldset.pday { border: none; border-top: 1px solid var(--line); margin: 0; padding: 12px 0 0; display: flex; flex-direction: column; gap: 8px; min-width: 0; }
fieldset.pday legend { font-family: var(--f-display); font-weight: 700; font-size: 17px; padding: 0 6px 0 0; }
.grid3 { display: grid; grid-template-columns: 7.5rem 1fr 4.5rem; gap: 8px; }
.grid3 > * { min-width: 0; }
textarea { background: var(--surface); border: 1px solid var(--line); border-radius: 8px; padding: 10px 12px; width: 100%; font: inherit; color: inherit; resize: vertical; }
#goalOut { display: flex; flex-direction: column; gap: 10px; }
#goalOut .note { margin: 0; }

/* barcode */
.srow { display: flex; gap: 8px; }
.srow input { flex: 1; min-width: 0; }
.scanbtn { display: inline-flex; align-items: center; justify-content: center; gap: 6px; border: 1px solid var(--line); background: var(--surface); color: var(--accent);
  border-radius: 8px; padding: 0 14px; min-height: 44px; font-weight: 600; cursor: pointer; white-space: nowrap; }
.scanbtn svg { width: 20px; height: 20px; flex: none; }
.scanbig .scanbtn { width: 100%; min-height: 120px; flex-direction: column; font-size: 16px; border-style: dashed; border-width: 2px; }
.scanbig .scanbtn svg { width: 40px; height: 40px; }
.scanrow .scanbtn { flex: 1; background: var(--accent); color: var(--accent-ink); border-color: var(--accent); min-height: 46px; }
.vh { position: absolute; width: 1px; height: 1px; opacity: 0; overflow: hidden; clip: rect(0 0 0 0); pointer-events: none; }
.scanstate { padding: 36px 0; text-align: center; color: var(--muted); font-weight: 500; }
.warnbox { border: 1px solid var(--warn); border-radius: 8px; padding: 10px 12px; font-size: 14px; display: flex; flex-direction: column; gap: 6px; }
.warnbox b { color: var(--warn); }
.tag.chk { background: transparent; border: 1px solid var(--warn); color: var(--warn); }
a.ext { color: var(--accent); font-weight: 600; }

/* sign-in */
.authwrap { max-width: 440px; margin: 0 auto; padding-block: 8vh 40px; display: flex; flex-direction: column; gap: 16px; }
.authbrand { font-size: 44px; line-height: 1; }
textarea#cfgIn { font-family: ui-monospace, SFMono-Regular, Menlo, Consolas, monospace; font-size: 13px; }
label.btn { display: inline-flex; align-items: center; justify-content: center; cursor: pointer; }

/* live camera */
.camgo { display: flex; align-items: center; justify-content: center; gap: 10px; min-height: 56px; font-size: 17px; }
.camgo svg { width: 24px; height: 24px; }
.scanalt .scanbtn { width: 100%; }
#cam { position: fixed; inset: 0; z-index: 50; background: #000; color: #fff; }
#cam video { position: absolute; inset: 0; width: 100%; height: 100%; object-fit: cover; }
.camframe { position: absolute; inset: 0; display: grid; place-items: center; pointer-events: none; }
.aim { width: min(80vw, 440px); aspect-ratio: 2.2 / 1; max-width: 100%; border: 3px solid rgba(255,255,255,.95); border-radius: 14px; box-shadow: 0 0 0 100vmax rgba(0,0,0,.45); position: relative; overflow: hidden; }
.aim i { position: absolute; left: 6%; right: 6%; height: 2px; top: 50%; background: #ff5a4f; box-shadow: 0 0 8px #ff5a4f; animation: scanline 1.6s ease-in-out infinite alternate; }
@keyframes scanline { from { top: 18%; } to { top: 82%; } }
@media (prefers-reduced-motion: reduce) { .aim i { animation: none; } }
.cambar { position: absolute; left: 0; right: 0; display: flex; align-items: center; gap: 12px;
  padding-left: max(16px, env(safe-area-inset-left, 0px)); padding-right: max(16px, env(safe-area-inset-right, 0px)); }
.camtop { top: 0; padding-top: calc(env(safe-area-inset-top, 0px) + 12px); justify-content: space-between; }
.cambottom { bottom: 0; padding-bottom: calc(env(safe-area-inset-bottom, 0px) + 20px); flex-direction: column; text-align: center; }
#camMsg { font-weight: 600; text-shadow: 0 1px 4px rgba(0,0,0,.8); max-width: 34ch; }
.camclose { background: rgba(0,0,0,.45); border-color: rgba(255,255,255,.4); color: #fff; width: 46px; height: 46px; }
.camchip { background: rgba(0,0,0,.45); color: #fff; border-color: rgba(255,255,255,.4); }
.camchip[aria-pressed="true"] { background: #fff; color: #000; }
.camtype { background: rgba(0,0,0,.5); color: #fff; border-color: rgba(255,255,255,.5); }

/* toast */
#toast { position: fixed; z-index: 60; left: 50%; transform: translateX(-50%); bottom: calc(140px + env(safe-area-inset-bottom, 0px)); width: min(520px, calc(100% - 32px));
  background: var(--ink); color: var(--bg); border-radius: 10px; padding: 10px 14px; display: flex; justify-content: space-between; align-items: center; gap: 12px; font-size: 14px; box-shadow: 0 6px 18px rgba(0,0,0,.2); }
#toast button { background: none; border: none; color: var(--bg); font-weight: 700; text-decoration: underline; }
.status { font-size: 13px; color: var(--muted); display: flex; align-items: center; gap: 6px; }
.status i { width: 8px; height: 8px; border-radius: 50%; background: var(--accent); display: inline-block; }
.status.local i { background: var(--warn); }
@media (max-width: 380px) { .big .n { font-size: 54px; } .datenav .lbl { min-width: 88px; } }
</style>
</head>

<div class="app" id="app">

}

/* ---------- barcode reading from a photo ---------- */
let zxingP = null;
function loadZXing() {
  if (window.ZXing) return Promise.resolve(window.ZXing);
  if (!zxingP) zxingP = new Promise((res, rej) => {
    const s = document.createElement("script");
    s.src = "vendor/zxing.min.js";
    s.onload = () => window.ZXing ? res(window.ZXing) : rej(new Error("no ZXing"));
    s.onerror = () => { zxingP = null; rej(new Error("load failed")); };
    document.head.appendChild(s);
  });
  return zxingP;
}
function loadImg(file) {
  return new Promise((res, rej) => { const url = URL.createObjectURL(file), img = new Image();
    img.onload = () => { res(img); setTimeout(() => URL.revokeObjectURL(url), 1000); }; img.onerror = () => { URL.revokeObjectURL(url); rej(new Error("bad image")); }; img.src = url; });
}
function lumAt(img, maxDim) {
  const sc = Math.min(1, maxDim / Math.max(img.naturalWidth, img.naturalHeight)), w = Math.max(1, Math.round(img.naturalWidth * sc)), h = Math.max(1, Math.round(img.naturalHeight * sc));
  const cv = document.createElement("canvas"); cv.width = w; cv.height = h;
  const ctx = cv.getContext("2d", { willReadFrequently: true }); ctx.drawImage(img, 0, 0, w, h);
  const d = ctx.getImageData(0, 0, w, h).data, l = new Uint8ClampedArray(w * h);
  for (let i = 0; i < w * h; i++) l[i] = (d[i * 4] * 299 + d[i * 4 + 1] * 587 + d[i * 4 + 2] * 114) / 1000;
  return { l, w, h };
}
function rot90(o) { const { l, w, h } = o, r = new Uint8ClampedArray(w * h); for (let y = 0; y < h; y++) for (let x = 0; x < w; x++) r[x * h + (h - 1 - y)] = l[y * w + x]; return { l: r, w: h, h: w }; }
async function decodeFile(file) {
  const img = await loadImg(file);
  if ("BarcodeDetector" in window) {
    try {
      const sup = await window.BarcodeDetector.getSupportedFormats(), want = ["ean_13", "ean_8", "upc_a", "upc_e"].filter(f => sup.includes(f));
      if (want.length) { const r = await new window.BarcodeDetector({ formats: want }).detect(img); if (r && r.length) return r[0].rawValue; }
    } catch (e) {}
  }
  const Z = await loadZXing();
  const hints = new Map();
  hints.set(Z.DecodeHintType.POSSIBLE_FORMATS, [Z.BarcodeFormat.EAN_13, Z.BarcodeFormat.EAN_8, Z.BarcodeFormat.UPC_A, Z.BarcodeFormat.UPC_E]);
  hints.set(Z.DecodeHintType.TRY_HARDER, true);
  const reader = new Z.MultiFormatOneDReader(hints);
  for (const dim of [1280, 800, 1800]) {
    const base = lumAt(img, dim);
    for (const src of [base, rot90(base)]) {
      try { return reader.decode(new Z.BinaryBitmap(new Z.HybridBinarizer(new Z.RGBLuminanceSource(src.l, src.w, src.h))), hints).getText(); } catch (e) {}
    }
  }
  return null;
}

const pending = {}, running = {};
function put(path, data) {

}
async function flush(path) {

    let tries = 0;
    for (;;) {
      try { const ref = DB.doc(path); if (d.__del) await ref.delete(); else await ref.set(d); break; }
      catch (e) {

  if (navigator.onLine === false) return '<span class="status local"><i></i>Offline · changes sync when you\'re back online</span>';

}

function sparkline(ser) {
  const end = ser[ser.length - 1].k, start = addDays(end, -29);
  const pts = ser.filter(s => s.k >= start);
  if (pts.length < 2) return "";
  const W = 320, H = 76, pl = 6, pr = 44, pt = 8, pb = 8;
  let lo = Math.min(...pts.map(p => Math.min(p.w, p.t))), hi = Math.max(...pts.map(p => Math.max(p.w, p.t)));
  if (hi - lo < 1) { const m = (hi + lo) / 2; lo = m - 0.5; hi = m + 0.5; }
  const span = (pkey(end) - pkey(start)) / 864e5 || 1;
  const x = k => pl + ((pkey(k) - pkey(start)) / 864e5) / span * (W - pl - pr);
  const y = v => pt + (hi - v) / (hi - lo) * (H - pt - pb);
  const line = pts.map((p, i) => (i ? "L" : "M") + x(p.k).toFixed(1) + " " + y(p.t).toFixed(1)).join(" ");
  const dots = pts.map(p => '<circle cx="' + x(p.k).toFixed(1) + '" cy="' + y(p.w).toFixed(1) + '" r="2.2" fill="var(--muted)" opacity=".55"/>').join("");
  const lp = pts[pts.length - 1];
  return '<svg class="spark" viewBox="0 0 ' + W + ' ' + H + '" preserveAspectRatio="none" role="img" aria-label="Weight trend, last 30 days">' +
    '<line x1="' + pl + '" x2="' + (W - pr) + '" y1="' + y(hi) + '" y2="' + y(hi) + '" stroke="var(--line)" stroke-width="1"/>' +
    '<line x1="' + pl + '" x2="' + (W - pr) + '" y1="' + y(lo) + '" y2="' + y(lo) + '" stroke="var(--line)" stroke-width="1"/>' + dots +
    '<path d="' + line + '" fill="none" stroke="var(--accent)" stroke-width="2.4" stroke-linejoin="round" stroke-linecap="round" vector-effect="non-scaling-stroke"/>' +
    '<circle cx="' + x(lp.k).toFixed(1) + '" cy="' + y(lp.t).toFixed(1) + '" r="4" fill="var(--accent)"/>' +
    '<text x="' + (W - pr + 6) + '" y="' + (y(hi) + 4) + '" font-size="11" fill="var(--muted)" font-family="Barlow, sans-serif">' + f1(r1(hi)) + '</text>' +
    '<text x="' + (W - pr + 6) + '" y="' + (y(lo) + 4) + '" font-size="11" fill="var(--muted)" font-family="Barlow, sans-serif">' + f1(r1(lo)) + '</text></svg>';
}

function goalInfo(hcm, cw, waist) {
  if (!(hcm > 120 && hcm < 230)) return { html: '<p class="note">Enter your height to see a suggested target.</p>', suggest: null };
  const r = healthyRange(hcm), wl = hcm / 2;
  let html = '<div class="totals"><div>Healthy BMI range<b>' + f0(r.lo) + '–' + f0(r.hi) + ' kg</b></div><div>Waist goal<b>under ' + f0(wl) + ' cm</b></div>';
  if (cw) html += '<div>Your BMI now<b>' + f1(r1(cw / Math.pow(hcm / 100, 2))) + '</b></div>';
  if (waist > 40) html += '<div>Waist ÷ height<b>' + f1(Math.round(waist / hcm * 100) / 100) + '</b></div>';
  html += '</div>';
  let suggest = null;
  if (cw && cw > r.hi) {
    suggest = Math.floor(r.hi); const weeks = Math.ceil((cw - suggest) / 0.45);
    html += '<p class="note">Suggested target: <b>' + suggest + ' kg</b>, the top of the healthy BMI range. At a 500 kcal daily deficit (about 0,45 kg a week) that takes roughly ' + weeks + ' weeks. Because you lift, BMI can overstate body fat, so let your waist decide: once it is under ' + f0(wl) + ' cm you are in the healthy range, whatever the scale says.</p>';
  } else if (cw) {
    html += '<p class="note">You are already inside the healthy BMI range, so the scale is a weak guide from here. Use your waist instead: aim for under ' + f0(wl) + ' cm, and only set a lower target weight if your waist is still above that.</p>';
  } else html += '<p class="note">Log a morning weight on the Today page and a suggestion will appear here.</p>';
  if (waist > 40 && waist / hcm >= 0.5) html += '<p class="note">Your waist is ' + f0(waist - wl) + ' cm above the goal. Measure it every couple of weeks at the same spot.</p>';
  html += '<p class="note">The cut-offs come from NICE (UK) guidance and are the same for all adults, so your age doesn\'t change them.</p>';
  return { html, suggest };
}

  const day = getDay(S.date), e = day.entries.find(x => x.id === id); if (!e) return;
  const it = itemOf(e);
  const base = { ctx: "log", date: S.date, meal: e.meal, editId: id };
  if (it && (e.mode === "g" || e.mode === "u") && !(e.mode === "u" && !it.u) && !(e.mode === "g" && it.k == null)) { openSheet(Object.assign(base, { view: "amount", item: it, mode: e.mode, amt: e.amt })); }
  else openSheet(Object.assign(base, { view: "quick", quick: { name: e.name, kcal: e.kcal, p: e.p, est: e.est } }));
}
function replaceEntry(newE) {
  const sh = S.sheet, day = getDay(sh.date), ix = day.entries.findIndex(x => x.id === sh.editId);
  if (ix < 0) return; newE.id = sh.editId; day.entries[ix] = newE; saveDay(day); closeSheet(); toast("Saved");
}
function deleteEntry() {
  const sh = S.sheet, day = getDay(sh.date), ix = day.entries.findIndex(x => x.id === sh.editId); if (ix < 0) return;
  const removed = day.entries[ix]; day.entries.splice(ix, 1); saveDay(day); closeSheet();
  toast("Deleted " + removed.name, () => { const d = getDay(day.date); d.entries.splice(Math.min(ix, d.entries.length), 0, removed); saveDay(d); });
}

let toastTimer = null;
function toast(msg, undo) {
  const t = document.getElementById("toast");
  t.innerHTML = '<span>' + esc(msg) + '</span>' + (undo ? '<button type="button" id="undoBtn">Undo</button>' : '');
  t.hidden = false;
  if (undo) document.getElementById("undoBtn").onclick = () => { undo(); t.hidden = true; };
  clearTimeout(toastTimer); toastTimer = setTimeout(() => { t.hidden = true; }, undo ? 5000 : 3000);
}
function armed(btn, label) {
  if (btn.dataset.armed) return true;
  btn.dataset.armed = "1"; const old = btn.textContent; btn.textContent = label;
  setTimeout(() => { if (btn.isConnected) { delete btn.dataset.armed; btn.textContent = old; } }, 3000);
  return false;
}

document.addEventListener("click", ev => {
  if (ev.target.closest && ev.target.closest("[data-scanfor]")) armPickerWatch();
  const a = ev.target.closest("[data-a]"); if (!a) return;
  const act = a.dataset.a, sh = S.sheet;
  switch (act) {
    case "tab": S.tab = a.dataset.v; window.scrollTo(0, 0); render(); break;
    case "prevDay": S.date = addDays(S.date, -1); fetchDayIfMissing(S.date); render(); break;
    case "nextDay": S.date = addDays(S.date, 1); render(); break;
    case "goToday": S.date = today(); render(); break;
    case "openAdd": openAdd(a.dataset.meal); break;
    case "closeSheet": closeSheet(); break;
    case "setMeal": sh.meal = a.dataset.meal; a.parentElement.querySelectorAll(".chip").forEach(c => c.setAttribute("aria-pressed", String(c === a)));
      document.querySelectorAll("#sheetIn .btn").forEach(b => { if (/^Add to /.test(b.textContent) && b.textContent !== "Add to recipe") b.textContent = "Add to " + MEALNAME[sh.meal].toLowerCase(); }); break;
    case "sheetView": sh.view = a.dataset.v; sh.editId = null; renderSheet(true); break;
    case "pickItem": { const it = itemFromKey(a.dataset.k); if (it) startAmount(it); break; }
    case "pickRecent": { const e = recents()[+a.dataset.i]; if (!e) break; const it = itemOf(e);
      if (it && (e.mode === "g" || e.mode === "u")) startAmount(it, { mode: e.mode, amt: e.amt }); else { sh.view = "quick"; sh.quick = { name: e.name, kcal: e.kcal, p: e.p, est: e.est }; renderSheet(); } break; }
    case "again": { const e = recents()[+a.dataset.i]; if (e) { relogRecent(e, sh.meal, sh.date); renderSheet(); } break; }
    case "backSearch": backToSearch(); break;
    case "setMode": { const it = sh.item, m = a.dataset.v; if (m === sh.mode) break; updateAmount();
      if (it.u && it.u.g) sh.amt = m === "g" ? Math.round(sh.amt * it.u.g) : r1(sh.amt / it.u.g) || 1; else sh.amt = m === "g" ? 100 : 1;
      sh.mode = m; renderSheet(); break; }
    case "setAmt": document.getElementById("amt").value = f1(+a.dataset.v); updateAmount(); break;
    case "confirmAmount": {
      updateAmount(); if (!(sh.amt > 0)) { toast("Enter an amount above zero."); break; }
      const it = sh.item;
      if (sh.ctx === "recipe") {
        const r = calc(it, sh.amt, sh.mode);
        sh.draft.ings.push({ type: it.type, id: it.id, name: it.name, g: r.g != null ? Math.round(r.g) : null, label: sh.mode === "g" ? f0(sh.amt) + " g" : f1(sh.amt) + " " + it.u.l, kcal: Math.round(r.k), p: r1(r.p) });
        sh.view = "recipe"; renderSheet(); break;
      }
      const e = makeEntry(it, sh.amt, sh.mode, sh.meal);
      if (sh.editId) { replaceEntry(e); break; }
      addEntries(sh.date, [e], "Added " + e.name + " · " + f0(e.kcal) + " kcal"); backToSearch(); break;
    }
    case "deleteEntry": if (armed(a, "Tap again to delete")) deleteEntry(); break;
    case "editEntry": editEntry(a.dataset.id); break;
    case "copyMeal": { const m = a.dataset.meal, y = getDay(addDays(S.date, -1)).entries.filter(e => e.meal === m);
      const copies = y.map(e => Object.assign(clone(e), { id: uid() })); addEntries(S.date, copies, "Copied " + copies.length + (copies.length === 1 ? " item" : " items") + " · " + f0(sumEntries(copies).k) + " kcal"); break; }
    case "newFood": openSheet({ view: "food", ctx: "foods", food: {} }); break;
    case "editFood": openSheet({ view: "food", ctx: "foods", foodId: a.dataset.id, food: clone(S.foods[a.dataset.id]) }); break;
    case "newFoodFromSearch": sh.food = { name: sh.q || "" }; sh.foodId = null; sh.foodBack = "backSearch"; sh.view = "food"; renderSheet(); break;
    case "deleteFood": if (armed(a, "Tap again to delete")) { const id = sh.foodId; delete S.foods[id]; put("foods/" + id, null); closeSheet(); toast("Food deleted"); } break;
    case "newRecipe": openSheet({ view: "recipe", ctx: "recipe", draft: { id: uid(), name: "", ings: [], portions: 4, cooked: null } }); break;
    case "editRecipe": openSheet({ view: "recipe", ctx: "recipe", draft: clone(S.recipes[a.dataset.id]) }); break;
    case "addIng": readRecipeFields(); sh.view = "search"; sh.q = ""; renderSheet(true); break;
    case "rmIng": readRecipeFields(); sh.draft.ings.splice(+a.dataset.i, 1); renderSheet(); break;
    case "backRecipe": sh.view = "recipe"; renderSheet(); break;
    case "saveRecipe": { const r = readRecipeFields(); if (!r.name) { toast("Give the recipe a name."); document.getElementById("rN").focus(); break; }
      if (!r.ings.length) { toast("Add at least one ingredient."); break; }
      S.recipes[r.id] = clone(r); put("recipes/" + r.id, clone(r)); closeSheet(); toast("Recipe saved"); break; }
    case "openScan": sh.view = "scan"; sh.scan = { state: "idle" }; renderSheet(); if (liveSupported()) startLiveScan(); break;
    case "openScanFoods": openSheet({ ctx: "foods", view: "scan", scan: { state: "idle" } }); if (liveSupported()) startLiveScan(); break;
    case "liveScan": startLiveScan(); break;
    case "camClose": stopLiveScan(); break;
    case "camTorch": toggleTorch(); break;
    case "camType": stopLiveScan(); { const i = document.getElementById("bcIn"); if (i) i.focus(); } break;
    case "useLocal": lsSet(LMODE, "local"); stopCloud(); startLocal(); break;
    case "enableSync": lsSet(LMODE, null); location.reload(); break;
    case "signOut": if (armed(a, "Tap again to sign out")) { lsSet(LMODE, null); if (AUTH) AUTH.signOut(); } break;
    case "exportBackup": exportBackup(); break;
    case "signUp": case "resetPw": {
      const e = (document.getElementById("liE") || {}).value || "", p = (document.getElementById("liP") || {}).value || "";
      if (!AUTH) break;
      if (!e.trim()) { setAuthErr("Type your email first."); break; }
      lsSet("vagen-email", e.trim());
      if (act === "resetPw") AUTH.sendPasswordResetEmail(e.trim()).then(() => toast("Password reset link sent to " + e.trim())).catch(err => setAuthErr(authMsg(err)));
      else { if (p.length < 6) { setAuthErr("Use a password with at least 6 characters."); break; } AUTH.createUserWithEmailAndPassword(e.trim(), p).catch(err => setAuthErr(authMsg(err))); }
      break;
    }
    case "backProduct": sh.view = "product"; renderSheet(); break;
    case "backScan": sh.view = "scan"; sh.scan = { state: "idle" }; renderSheet(); break;
    case "useProduct": if (sh.prod) startAmount(sh.prod); break;
    case "saveProduct": { const id = myFoodByBarcode(sh.code) || uid(), obj = offToFood(sh.prod); S.foods[id] = obj; put("foods/" + id, clone(obj)); closeSheet(); toast("Saved to My foods"); break; }
    case "correctProduct":
      if (sh.prodSrc === "mine") { sh.foodId = sh.prodId; sh.food = clone(S.foods[sh.prodId]); }
      else { sh.foodId = myFoodByBarcode(sh.code); sh.food = offToFood(sh.prod); }
      sh.foodBack = "backProduct"; sh.view = "food"; renderSheet(); break;
    case "addFromLabel": sh.food = { bc: sh.code }; sh.foodId = null; sh.foodBack = "backProduct"; sh.view = "food"; renderSheet(); break;
    case "logTrain": openTrainLog(S.date, null); break;
    case "editTrain": openTrainLog(S.date, +a.dataset.i); break;
    case "setFeel": sh.feel = a.dataset.v; a.parentElement.querySelectorAll(".chip").forEach(c => c.setAttribute("aria-pressed", String(c === a))); break;
    case "saveTrain": saveTrainLog(); break;
    case "editPlanDay": { const i = +a.dataset.i; openSheet({ ctx: "plan", view: "planday", i, d: clone(getPlan()[i]) }); break; }
    case "savePlanDay": { const d = readPlanDraft(), kind = kindOf(d);
      if (d.type === "cardio") { d.set = pickKeys(d.set, steadyFields(kind)); d.hard = pickKeys(d.hard, MACH[kind].f); d.easy = pickKeys(d.easy, MACH[kind].f); if (!d.machine) d.machine = "other"; if (!d.format) d.format = "steady"; }
      d.rev = Date.now(); const plan = clone(getPlan()); plan[sh.i] = d; const nm = DAYS_EN[sh.i]; closeSheet(); saveSettings({ plan }, nm + " saved"); break; }
    case "rmTrain": { const d = getDay(S.date), i = +a.dataset.i, removed = (d.training || [])[i]; if (!removed) break; d.training.splice(i, 1); saveDay(d);
      toast("Removed " + removed.title, () => { const d2 = getDay(S.date); d2.training = d2.training || []; d2.training.splice(Math.min(i, d2.training.length), 0, removed); saveDay(d2); }); break; }
    case "showOther": S.showOther = true; render(); { const m = document.getElementById("oM"); if (m) m.focus(); } break;
    case "hideOther": S.showOther = false; render(); break;
    case "resetPlan": if (armed(a, "Tap again to reset")) { const now = Date.now(); saveSettings({ plan: clone(DEFAULT_PLAN).map(d => Object.assign(d, { rev: now })), strengthGoal: 3, cardioGoal: 150 }, "Week reset to the suggested plan"); } break;
    case "deleteRecipe": if (armed(a, "Tap again to delete")) { const id = sh.draft.id; delete S.recipes[id]; put("recipes/" + id, null); closeSheet(); toast("Recipe deleted"); } break;
  }
});
document.addEventListener("change", ev => {
  if (ev.target.id === "partialChk") { const d = getDay(S.date); d.partial = ev.target.checked; saveDay(d); }
});
document.addEventListener("input", ev => {
  const id = ev.target.id;
  if (id === "q" && S.sheet) { S.sheet.q = ev.target.value; renderResults(); }
  else if (id === "amt") updateAmount();
  else if (id === "rPor" || id === "rCk" || id === "rN") updateRecipeTotals();
  else if (id === "qK" || id === "qE") updateQuick();
  else if (id === "fKj" || id === "fK" || id === "fP" || id === "fF" || id === "fC") {
    if (id === "fKj") { const kj = num(ev.target.value); if (kj > 0) document.getElementById("fK").value = f0(kj / 4.184); }
    const g = x => num(document.getElementById(x).value), w = document.getElementById("fWarn");
    if (w) w.innerHTML = warnBox(checkNutrition({ k: g("fK"), p: g("fP"), f: g("fF"), c: g("fC") }).filter(x => !/is missing\.$/.test(x)));
  }
  else if (id === "gH" || id === "gW") {
    const g = goalInfo(num(document.getElementById("gH").value), currentWeight(), num(document.getElementById("gW").value));
    document.getElementById("goalOut").innerHTML = g.html;
    const t = document.getElementById("gT"); if (t && !S.settings.targetWeight && g.suggest) t.value = g.suggest;
  }
});
document.addEventListener("change", ev => {
  const id = ev.target.id;
  if (id === "qE") updateQuick();
  if (id === "impFile") {
    const file = ev.target.files && ev.target.files[0]; ev.target.value = ""; if (!file) return;
    file.text().then(t => { let o = null; try { o = JSON.parse(t); } catch (e) {} importBackup(o); }).catch(() => toast("Couldn't read that file."));
  }
  if (id === "scanFile" || id === "scanFileFoods") { const file = ev.target.files && ev.target.files[0]; ev.target.value = ""; handleScanFile(file, id === "scanFileFoods"); }
  if ((id === "pdT" || id === "pdK" || id === "pdF") && S.sheet && S.sheet.view === "planday") { readPlanDraft(); renderSheet(); const el = document.getElementById(id); if (el) el.focus(); }
});
function updateQuick() {
  const o = document.getElementById("qOut"); if (!o) return;
  const k = num(document.getElementById("qK").value), est = document.getElementById("qE").checked;
  o.textContent = k > 0 && est ? "Will log " + f0(k * EST_BUMP) + " kcal" : "";
}
document.addEventListener("submit", ev => {
  const f = ev.target.closest("[data-form]"); if (!f) return; ev.preventDefault();
  const kind = f.dataset.form, sh = S.sheet;
  if (kind === "weight") {
    const raw = document.getElementById("wIn").value.trim(), w = num(raw), d = getDay(S.date);
    if (raw === "") { d.weight = null; saveDay(d); toast("Weight cleared"); return; }
    if (!(w > 25 && w < 350)) { toast("Enter your weight in kg, for example 84,6."); return; }
    d.weight = r1(w); saveDay(d); toast("Weight saved"); document.activeElement && document.activeElement.blur(); return;
  }
  if (kind === "quick") {
    const k = num(document.getElementById("qK").value); if (!(k > 0)) { toast("Enter the calories."); document.getElementById("qK").focus(); return; }
    const p = num(document.getElementById("qP").value), est = document.getElementById("qE").checked;
    const name = document.getElementById("qN").value.trim() || (est ? "Estimated meal" : "Quick add");
    const e = { id: uid(), meal: sh.meal, name, kcal: Math.round(est ? k * EST_BUMP : k), p: p > 0 ? r1(p) : 0, amt: null, mode: "q", ul: null, g: null, ref: { type: "q", id: "" }, est };
    if (sh.editId) { replaceEntry(e); return; }
    addEntries(sh.date, [e], "Added " + name + " · " + f0(e.kcal) + " kcal"); sh.quick = null; renderSheet(); return;
  }
  if (kind === "food") {
    const name = document.getElementById("fN").value.trim(), k = num(document.getElementById("fK").value), p = num(document.getElementById("fP").value);
    const ul = document.getElementById("fUl").value.trim(), ug = num(document.getElementById("fUg").value);
    if (!name) { toast("Give the food a name."); return; }
    if (!(k >= 0 && k <= 900)) { toast(k > 900 ? "Over 900 kcal per 100 g isn't possible. Is that the kJ number? Put it in the kJ field." : "Enter the energy in kcal per 100 g."); return; }
    if (!(p >= 0 && p <= 100)) { toast("Protein per 100 g should be between 0 and 100 g."); return; }
    const fat = num(document.getElementById("fF").value), carb = num(document.getElementById("fC").value), bc = document.getElementById("fBc").value.replace(/\D/g, "");
    if ([fat, carb].some(x => isFinite(x) && (x < 0 || x > 100))) { toast("Fat and carbs per 100 g should be between 0 and 100 g."); return; }
    if (bc && bc.length < 6) { toast("That barcode looks too short. Check the digits, or leave it empty."); return; }
    const src = (sh.food && sh.food.src) || "";
    const id = sh.foodId || (bc && myFoodByBarcode(bc)) || uid();
    const obj = { name, k, p, f: isFinite(fat) ? fat : null, c: isFinite(carb) ? carb : null, ul: ul && ug > 0 ? ul : "", ug: ul && ug > 0 ? ug : null, bc: bc || "", src };
    S.foods[id] = obj; put("foods/" + id, clone(obj));
    if (sh.ctx === "log" || sh.ctx === "recipe") { startAmount(getItem("c", id)); toast(src === "off" ? "Correction saved" : "Saved to My foods"); }
    else { closeSheet(); toast(src === "off" ? "Correction saved. Scans of this barcode now use it." : "Food saved"); }
    return;
  }
  if (kind === "cfg") {
    const c = parseConfig(document.getElementById("cfgIn").value || "");
    if (!c) { S.setupErr = "Couldn't read that. Copy the whole block from { to }, including apiKey and projectId."; S._authView = null; render(); return; }
    lsSet(LCFG, JSON.stringify(c)); lsSet(LMODE, null); location.reload(); return;
  }
  if (kind === "login") {
    const e = document.getElementById("liE").value.trim(), p = document.getElementById("liP").value;
    if (!AUTH) return;
    if (!e || !p) { setAuthErr("Type your email and password."); return; }
    lsSet("vagen-email", e); setAuthErr("");
    AUTH.signInWithEmailAndPassword(e, p).catch(err => setAuthErr(authMsg(err))); return;
  }
  if (kind === "bc") {
    const code = document.getElementById("bcIn").value.replace(/\D/g, "");
    if (code.length < 6) { toast("Type all the digits under the barcode."); return; }
    if (!validEan(code)) toast("Those digits don't form a valid barcode. Looking it up anyway, but check for a typo.");
    lookupCode(code); return;
  }
  if (kind === "other") {
    const type = document.getElementById("oT").value, m = num(document.getElementById("oM").value), name = document.getElementById("oN").value.trim();
    if (!(m > 0 && m < 600)) { toast("Enter how many minutes you trained."); document.getElementById("oM").focus(); return; }
    const d = getDay(S.date); d.training = (d.training || []).concat([{ type, title: name || (type === "strength" ? "Strength" : type === "cardio" ? "Cardio" : "Activity"), min: Math.round(m), planned: false }]);
    S.showOther = false; saveDay(d); toast("Session logged"); return;
  }
  if (kind === "goal") {
    const hcm = num(document.getElementById("gH").value), w = num(document.getElementById("gW").value), t = num(document.getElementById("gT").value);
    if (!(hcm > 120 && hcm < 230)) { toast("Enter your height in cm."); return; }
    if (document.getElementById("gT").value.trim() && !(t > 35 && t < 300)) { toast("Enter the target weight in kg."); return; }
    saveSettings({ height: Math.round(hcm), waist: w > 40 && w < 250 ? r1(w) : null, targetWeight: t > 35 && t < 300 ? r1(t) : null }, "Goal saved"); return;
  }
  if (kind === "plan") {
    const sg = num(document.getElementById("pSg").value), cg = num(document.getElementById("pCg").value);
    saveSettings({ strengthGoal: sg > 0 && sg <= 14 ? Math.round(sg) : 3, cardioGoal: cg > 0 && cg <= 2000 ? Math.round(cg) : 150 }, "Weekly goals saved"); return;
  }
  if (kind === "targets") {
    const k = num(document.getElementById("tK").value), p = num(document.getElementById("tP").value);
    if (!(k >= 1000 && k <= 6000)) { toast("Calories should be between 1 000 and 6 000."); return; }
    if (!(p >= 30 && p <= 400)) { toast("Protein should be between 30 and 400 g."); return; }
    S.settings = Object.assign({}, S.settings, { kcal: Math.round(k), protein: Math.round(p), saved: true });
    put("settings/main", clone(S.settings)); render(); toast("Targets saved"); return;
  }
  if (kind === "calc") {
    const sex = document.getElementById("cSex").value, age = num(document.getElementById("cAge").value), hcm = num(document.getElementById("cH").value), w = num(document.getElementById("cW").value), act = num(document.getElementById("cAct").value);
    if (!(age > 14 && age < 100) || !(hcm > 120 && hcm < 230) || !(w > 35 && w < 300)) { toast("Fill in age, height in cm and weight in kg."); return; }
    const bmr = 10 * w + 6.25 * hcm - 5 * age + (sex === "m" ? 5 : -161), tdee = bmr * act;
    const kcal = Math.round((tdee - 500) / 50) * 50, prot = Math.round(w * 2 / 5) * 5;
    document.getElementById("calcOut").textContent = "Estimated burn: about " + f0(Math.round(tdee / 50) * 50) + " kcal a day. Target: " + f0(kcal) + " kcal (500 below) and " + f0(prot) + " g protein (2 g per kg).";
    document.getElementById("tK").value = kcal; document.getElementById("tP").value = prot;
    S.settings = Object.assign({}, S.settings, { sex, age, height: hcm, activity: act, weight: w });
    toast("Filled in. Tap Save targets to use them."); return;
  }
});
document.addEventListener("keydown", ev => {
  if (ev.key === "Escape" && CAM.on) { stopLiveScan(); return; }
  if (ev.key === "Escape" && S.sheet) closeSheet();
  const l = ev.target.closest && ev.target.closest("[data-scanfor]");
  if (l && (ev.key === "Enter" || ev.key === " ")) { ev.preventDefault(); const i = document.getElementById(l.dataset.scanfor); if (i) i.click(); }
});
async function fetchDayIfMissing(k) {
  if (!DB || S.days[k]) return;
  try { const d = await DB.doc("days/" + k).get(); if (d.exists && !S.days[k]) { S.days[k] = clone(d.data()); render(); } } catch (e) {}
}
setInterval(() => { if (S.tab === "today" && !S.sheet && S._lastToday && S._lastToday !== today() && S.date === S._lastToday) { S.date = today(); render(); } S._lastToday = today(); }, 60000);
S._lastToday = today();

window.addEventListener("online", () => { if (!S.sheet) render(); });
window.addEventListener("offline", () => { if (!S.sheet) render(); });
document.addEventListener("visibilitychange", () => { if (document.hidden && CAM.on) stopLiveScan(); });
if ("serviceWorker" in navigator && (location.protocol === "https:" || location.hostname === "localhost")) {
  window.addEventListener("load", () => { navigator.serviceWorker.register("sw.js").catch(() => {}); });
}
render();
initStore();
})();
